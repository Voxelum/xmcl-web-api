name = "xmcl-web-ai"
account_id = "7af57e4bbecec7133ccf33d2b530b4b5"
main = "worker.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
XMCL_HOME_RELEASE_ENABLED = "true"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 1

[[routes]]
pattern = "ai.xmcl.app"
custom_domain = true

[[durable_objects.bindings]]
name = "DPOP_REPLAY"
class_name = "DpopReplayObject"
script_name = "xmcl-web-api"

[[durable_objects.bindings]]
name = "ALERT_COOLDOWN"
class_name = "AlertCooldownObject"
script_name = "xmcl-web-api"
