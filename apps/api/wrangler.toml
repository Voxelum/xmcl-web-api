name = "xmcl-web-api"
account_id = "7af57e4bbecec7133ccf33d2b530b4b5"
main = "worker.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "api.xmcl.app"
custom_domain = true

[[durable_objects.bindings]]
name = "DPOP_REPLAY"
class_name = "DpopReplayObject"

# Secrets and optional bindings are configured per Worker. The API Worker owns
# Mongo-backed routes, payment webhooks, and scheduled work.

[[queues.consumers]]
queue = "xmcl-translation"
max_batch_size = 1
max_retries = 3
