name = "xmcl-web-api"
account_id = "7af57e4bbecec7133ccf33d2b530b4b5"
main = "worker.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
BILLING_CURRENCY = "USD"
BILLING_RATES_JSON = "[]"
MONGODB_NAME = "coturn"
XMCL_DEPLOYMENT_ENVIRONMENT = "production"
XMCL_HOME_RELEASE_ENABLED = "true"
WAFFO_ENVIRONMENT = "prod"
WAFFO_STORE_ID = "STO_43NzeqTrCZj6Z1Dvqd76Di"
WAFFO_PRODUCT_ID = "PROD_3jywaliubkyhIgeYSGXx5s"
WAFFO_SUCCESS_URL = "https://xmcl.app/together"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "api.xmcl.app"
custom_domain = true

[[migrations]]
tag = "v6"
deleted_classes = ["MultiplayerRoomObject"]

[[durable_objects.bindings]]
name = "DPOP_REPLAY"
class_name = "DpopReplayObject"

[[durable_objects.bindings]]
name = "ALERT_COOLDOWN"
class_name = "AlertCooldownObject"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["DpopReplayObject"]

[[migrations]]
tag = "v8-alert-cooldown"
new_sqlite_classes = ["AlertCooldownObject"]

# Secrets and optional bindings are configured per Worker. The API Worker owns
# Mongo-backed routes, payment webhooks, and scheduled work.

[[queues.consumers]]
queue = "xmcl-translation"
max_batch_size = 1
max_retries = 3
