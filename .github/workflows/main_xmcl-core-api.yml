name: Deploy XMCL Web API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "src/**"
      - "deno.json"
      - "deno.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main_xmcl-core-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --omit=optional

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci --omit=optional

      - name: Type-check Workers
        working-directory: cloudflare
        run: npm run typecheck

      - name: Deploy Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: cloudflare
        run: npm run deploy

      - name: Report manual deployment requirement
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; Worker deployments were skipped."
