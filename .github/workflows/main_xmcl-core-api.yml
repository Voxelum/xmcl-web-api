name: Deploy XMCL Web API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - 'src/**'
      - 'deno.json'
      - 'deno.lock'
      - '.github/workflows/main_xmcl-core-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --omit=optional

      - name: Install API dependencies
        run: npm ci

      - name: Install Cloudflare toolchain
        working-directory: cloudflare
        run: npm install --no-package-lock

      - name: Type-check Worker
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: cloudflare
        run: npm run deploy

      - name: Report manual deployment requirement
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; Worker deployment was skipped."
