name: Deploy XMCL Web API to Cloudflare Workers

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/api/**"
      - "apps/ai/**"
      - "apps/signaling/**"
      - "apps/waffo-staging/**"
      - "src/**"
      - "deno.json"
      - "deno.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main_xmcl-core-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    permissions:
      contents: read
    env:
      # Wrangler requires this process variable name. The stored GitHub secret
      # is named by purpose so it cannot be confused with runtime TURN tokens.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --omit=optional

      - name: Type-check Workers
        run: npm run typecheck:workers

      - name: Deploy Workers
        if: ${{ github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy:workers

      - name: Validate staging Worker
        if: github.ref_name == 'staging'
        run: npm run check:waffo-staging

      - name: Deploy staging Worker
        if: ${{ github.ref_name == 'staging' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy:waffo-staging

      - name: Report manual production deployment requirement
        if: ${{ github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; production Worker deployments were skipped."

      - name: Report manual staging deployment requirement
        if: ${{ github.ref_name == 'staging' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not configured; staging Worker deployment was skipped."
