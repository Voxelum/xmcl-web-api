name: Deploy XMCL Web API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/ai/**"
      - "apps/signaling/**"
      - "src/**"
      - "deno.json"
      - "deno.lock"
      - "package.json"
      - "package-lock.json"
      - "scripts/production-worker-config.mjs"
      - "scripts/production-worker-config.test.mjs"
      - ".github/workflows/main_xmcl-core-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONGODB_NAME: ${{ secrets.MONGODB_NAME }}
      BILLING_CURRENCY: ${{ vars.BILLING_CURRENCY }}
      BILLING_RATES_JSON: ${{ vars.BILLING_RATES_JSON }}
      WAFFO_STORE_ID: ${{ vars.WAFFO_STORE_ID }}
      WAFFO_PRODUCT_ID: ${{ vars.WAFFO_PRODUCT_ID }}
      WAFFO_ENVIRONMENT: ${{ vars.WAFFO_ENVIRONMENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --omit=optional

      - name: Type-check Workers
        run: npm run typecheck:workers

      - name: Test production Worker configuration
        run: node --test scripts/production-worker-config.test.mjs

      - name: Require Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for production."
            exit 1
          fi

      - name: Synchronize API production configuration
        run: node scripts/production-worker-config.mjs | npx wrangler secret bulk --config apps/api/wrangler.toml

      - name: Synchronize AI production database
        run: node scripts/production-worker-config.mjs --database-only | npx wrangler secret bulk --config apps/ai/wrangler.toml

      - name: Synchronize signaling production database
        run: node scripts/production-worker-config.mjs --database-only | npx wrangler secret bulk --config apps/signaling/wrangler.toml

      - name: Verify API production bindings
        run: npx wrangler secret list --config apps/api/wrangler.toml | node scripts/production-worker-config.mjs --validate-bindings --surface=api

      - name: Verify AI production bindings
        run: npx wrangler secret list --config apps/ai/wrangler.toml | node scripts/production-worker-config.mjs --validate-bindings --surface=ai

      - name: Verify signaling production bindings
        run: npx wrangler secret list --config apps/signaling/wrangler.toml | node scripts/production-worker-config.mjs --validate-bindings --surface=signaling

      - name: Deploy Workers
        run: npm run deploy:workers
