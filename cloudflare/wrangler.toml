name = "xmcl-web-api"
account_id = "7af57e4bbecec7133ccf33d2b530b4b5"
main = "worker.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[routes]]
pattern = "api.xmcl.app"
custom_domain = true

[[routes]]
pattern = "ai.xmcl.app"
custom_domain = true

[[routes]]
pattern = "signaling.xmcl.app"
custom_domain = true

# Runtime configuration is set as Worker secrets. This prevents checked-in
# defaults from overriding values supplied by deployment automation.
#
# Shared workspace v2 requires these Worker secrets (never [vars]):
# XMCL_VULTR_OBJECT_STORAGE_ACCESS_KEY
# XMCL_VULTR_OBJECT_STORAGE_SECRET_KEY
# Alongside the endpoint, region, and bucket configuration, worker.ts creates
# the server-only SigV4 signer. Nodes receive only its command-bound URLs.
#
# The staging-only PayPal Sandbox webhook proxy also uses Worker secrets:
# PAYPAL_WEBHOOK_PROXY_URL, XMCL_PAYPAL_WEBHOOK_PROXY_KEY_ID, and
# XMCL_PAYPAL_WEBHOOK_PROXY_SECRET. Its destination is a fixed Azure `/api`
# endpoint; never configure these values in [vars].
#
# The staging-only M1 account/session proxy likewise uses Worker secrets:
# XMCL_STAGING_ACCOUNT_PROXY_ENABLED, XMCL_STAGING_ACCOUNT_PROXY_URL,
# XMCL_STAGING_ACCOUNT_PROXY_KEY_ID, XMCL_STAGING_ACCOUNT_PROXY_SECRET, and
# XMCL_STAGING_ACCOUNT_PROXY_CORS_ORIGINS. It must use a different key ID and
# secret from the M3 and PayPal proxy identities.
#
# Translation scheduling uses AZURE_TRANSLATION_TABLE_URL, AGNES_API_KEYS,
# and CURSEFORGE_KEY as Worker secrets. TRANSLATION_SCHEDULED_BATCH_LIMIT and
# TRANSLATION_I18N_BASE are optional configuration values.
#
# Translation content can be mirrored to an optional Workers KV binding named
# TRANSLATION_CACHE. Create it with:
#   wrangler kv namespace create TRANSLATION_CACHE
# Then add the returned namespace id:
#   [[kv_namespaces]]
#   binding = "TRANSLATION_CACHE"
#   id = "<namespace id>"

# MultiplayerRoom backs the versioned signaling service. The historical
# GroupRoom/SignalingRoom migrations remain for Cloudflare class compatibility.
[[durable_objects.bindings]]
name = "MULTIPLAYER_ROOM"
class_name = "MultiplayerRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MultiplayerRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["GroupRoom"]

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SignalingRoom"]

# This legacy consumer remains attached to the production Worker. Translation
# misses are now recorded in Azure Table; the handler only drains messages
# left by the retired queue pipeline.
[[queues.consumers]]
queue = "xmcl-translation"
max_batch_size = 1
max_retries = 3
