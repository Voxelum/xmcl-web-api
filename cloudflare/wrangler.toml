name = "xmcl-web-api"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Non-secret defaults. Secrets (GITHUB_PAT, MONGO_CONNECION_STRING, RTC_SECRET,
# AGNES_API_KEY, CURSEFORGE_KEY, MODRINTH_SECRET,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_APP_ID,
# XMCL_MULTIPLAYER_TICKET_SECRET) must be set with
# `wrangler secret put <NAME>` or via the dashboard. See .dev.vars.example.
# `keep_vars` preserves secrets managed outside this file.

[[routes]]
pattern = "api.xmcl.app"
custom_domain = true

[[durable_objects.bindings]]
name = "MULTIPLAYER_ROOM"
class_name = "MultiplayerRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MultiplayerRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["GroupRoom"]

# KV holds the per-(lang,id) translation semaphore (replaces the Deno.Kv lock).
[[kv_namespaces]]
binding = "TRANSLATION_KV"
id = "4caeaf8d43ef478ab61bd13b1e875457"

# Queue offloads mod-description translation (replaces the Deno.Kv queue).
# Optional: if absent the worker translates inline.
[[queues.producers]]
binding = "TRANSLATION_QUEUE"
queue = "xmcl-translation"

[[queues.consumers]]
queue = "xmcl-translation"
max_batch_size = 1
max_retries = 3

[triggers]
crons = ["0 0 * * *"]
